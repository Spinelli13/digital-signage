name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (testes de API + regressão)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Usa Postgres embutido (sem Docker) e as mesmas migrations de produção.
      - run: mvn -B test

  frontend:
    name: Painel Web (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  player:
    name: Player Android (testes unitários + APK debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
