name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (testes de API + regressão)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Usa Postgres embutido (sem Docker) e as mesmas migrations de produção.
      - run: mvn -B test

  frontend:
    name: Painel Web (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  player:
    name: Player Android (testes unitários + APK debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # O runner ubuntu já traz o Android SDK com as licenças aceitas.
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug

  backup-scripts:
    name: Scripts de backup (copia, restaura e confere)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # O pg_dump precisa ser da mesma versão do servidor (o Supabase usa o 17).
      - run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - run: scripts/backup/selftest.sh "postgresql://postgres:teste@localhost:5432"
