name: Deploy do painel

# Publica o painel no Cloudflare Pages a cada push na master que mude o frontend.
# Só roda de verdade depois de existir o segredo CLOUDFLARE_API_TOKEN (ver docs/DEPLOY.md, "Deploy automático
# do painel"). Enquanto ele não existir o job termina como "pulado" em vez de falhar.

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-painel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-painel
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar no Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Sem segredo configurado
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN não configurado: deploy automático pulado. Veja docs/DEPLOY.md."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testes e build (com a URL do backend)
        if: env.HAS_TOKEN == 'true'
        working-directory: frontend
        run: |
          test -n "$API_BASE_URL" || { echo "::error::Variável de repositório API_BASE_URL não definida"; exit 1; }
          npm ci
          npm test -- --watch=false
          npm run build

      - name: Conferir que o build aponta para o backend certo
        if: env.HAS_TOKEN == 'true'
        run: |
          cat frontend/dist/painel/browser/config.json
          grep -q "$API_BASE_URL" frontend/dist/painel/browser/config.json

      # Rodado da raiz do repositório (sem package.json) para a wrangler não alterar arquivos do projeto.
      - name: Publicar
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/dist/painel/browser --project-name signage-painel --branch master --commit-message "${{ github.sha }}"
