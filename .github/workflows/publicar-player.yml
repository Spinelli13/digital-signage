name: Publicar Player

# A cada push na master que mude o aplicativo da TV (player/**) ou os manuais, publica no site de downloads:
# APK assinado novo (as TVs se atualizam sozinhas), lista de versões e manuais em PDF.
# Só roda de verdade depois de existirem os segredos (ver docs/DEPLOY.md, "Publicar o Player automaticamente");
# enquanto faltarem, o job termina como "pulado" em vez de falhar.

on:
  push:
    branches: [master]
    paths:
      - "player/**"
      - "docs/INSTALACAO_TV.md"
      - "docs/MANUAL_PAINEL.md"
      - "docs/manual/**"
      - "scripts/release-player.mjs"
      - "scripts/build-manuals.mjs"
      - "scripts/manual-illustrations.mjs"
      - "frontend/public/favicon.*"
      - ".github/workflows/publicar-player.yml"
  workflow_dispatch:
    inputs:
      notes:
        description: "O que mudou nesta versão (aparece na lista de downloads)"
        required: false
      site_only:
        description: "Só republicar o site e os manuais, sem versão nova do APK"
        type: boolean
        default: false

concurrency:
  group: publicar-player
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar, assinar e publicar
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.SIGNAGE_KEYSTORE_BASE64 != '' && secrets.SIGNAGE_KEYSTORE_PASSWORD != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Sem segredos configurados
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::notice::Segredos do CI não configurados: publicação automática do Player pulada. Veja docs/DEPLOY.md."

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
        with:
          fetch-depth: 0 # o número da versão vem da contagem de commits

      - uses: actions/setup-java@v4
        if: env.HAS_SECRETS == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: "24"

      # Mudou algo dentro de player/? Então há APK novo. Só manuais/site? Republica sem versão nova.
      - name: Decidir o que publicar
        if: env.HAS_SECRETS == 'true'
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          SITE_ONLY_INPUT: ${{ inputs.site_only }}
          NOTES_INPUT: ${{ inputs.notes }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          site_only=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$SITE_ONLY_INPUT" = "true" ] && site_only=true
          elif ! git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null | grep -q '^player/'; then
            site_only=true
          fi
          notes="$NOTES_INPUT"
          if [ -z "$notes" ]; then notes="$(printf '%s' "$HEAD_MESSAGE" | head -n1)"; fi
          echo "site_only=$site_only" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF_NOTES"
            echo "$notes"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
          echo "Publicação: site_only=$site_only"

      - name: Testes do Player (nada é publicado se algum falhar)
        if: env.HAS_SECRETS == 'true' && steps.plan.outputs.site_only != 'true'
        working-directory: player
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Preparar a chave de assinatura
        if: env.HAS_SECRETS == 'true' && steps.plan.outputs.site_only != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNAGE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signage-release.jks"
          echo "SIGNAGE_KEYSTORE_FILE=$RUNNER_TEMP/signage-release.jks" >> "$GITHUB_ENV"

      - name: Publicar
        if: env.HAS_SECRETS == 'true'
        env:
          SIGNAGE_KEYSTORE_PASSWORD: ${{ secrets.SIGNAGE_KEYSTORE_PASSWORD }}
          SIGNAGE_KEY_ALIAS: ${{ secrets.SIGNAGE_KEY_ALIAS || 'signage' }}
          SIGNAGE_KEY_PASSWORD: ${{ secrets.SIGNAGE_KEY_PASSWORD || secrets.SIGNAGE_KEYSTORE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHROME_PATH: /usr/bin/google-chrome
          NOTES: ${{ steps.plan.outputs.notes }}
          SITE_ONLY: ${{ steps.plan.outputs.site_only }}
        run: |
          if [ "$SITE_ONLY" = "true" ]; then
            node scripts/release-player.mjs --site-only
          else
            node scripts/release-player.mjs --notes "$NOTES"
          fi
