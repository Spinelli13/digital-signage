<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#09090b" flood-opacity=".18"/></filter>
</defs>
<rect width="1040" height="330" rx="18" fill="#f4f4f5"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#0f0a16" text-anchor="start">Como a TV se atualiza</text><rect x="36" y="96" width="170" height="112" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="58" cy="96" r="15" fill="#6d28d9"/><text x="58" y="102" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="121" y="148" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="middle">Nova versão</text><text x="121" y="172" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">publicada no site</text><line x1="210" y1="152" x2="236" y2="152" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/><rect x="242" y="96" width="170" height="112" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="264" cy="96" r="15" fill="#6d28d9"/><text x="264" y="102" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="327" y="148" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="middle">A TV descobre</text><text x="327" y="172" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">a cada 30 min ou no</text><text x="327" y="190" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">botão do painel</text><line x1="416" y1="152" x2="442" y2="152" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/><rect x="448" y="96" width="170" height="112" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><circle cx="470" cy="96" r="15" fill="#6d28d9"/><text x="470" y="102" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="533" y="148" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="middle">Baixa e confere</text><text x="533" y="172" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">o arquivo (SHA‑256)</text><line x1="622" y1="152" x2="648" y2="152" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/><rect x="654" y="96" width="170" height="112" rx="14" fill="#ffffff" stroke="#e89a32" stroke-width="3"/><circle cx="676" cy="96" r="15" fill="#6d28d9"/><text x="676" y="102" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="739" y="148" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="middle">Android pergunta</text><text x="739" y="172" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">na TV: Atualizar?</text><line x1="828" y1="152" x2="854" y2="152" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="96" width="170" height="112" rx="14" fill="#ffffff" stroke="#d946ef" stroke-width="3"/><circle cx="882" cy="96" r="15" fill="#6d28d9"/><text x="882" y="102" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="945" y="148" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="middle">Aperte OK</text><text x="945" y="172" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">e ela volta sozinha</text><rect x="36" y="240" width="968" height="58" rx="12" fill="#fff6e6" stroke="#e89a32" stroke-width="2"/><text x="56" y="266" font-size="15" font-weight="700" fill="#0f0a16" text-anchor="start">O Android sempre pede a confirmação na TV (regra de segurança do sistema).</text><text x="56" y="286" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="start">Se ninguém confirmar em 10 minutos, o Player cancela e volta a exibir; tenta de novo mais tarde.</text>
</svg>
