<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3563e9"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10204a" flood-opacity=".18"/></filter>
</defs>
<rect width="1040" height="330" rx="18" fill="#f5f7fb"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Como a TV decide o que exibir</text><rect x="40" y="84" width="300" height="150" rx="14" fill="#ffffff" stroke="#3563e9" stroke-width="3"/><circle cx="64" cy="84" r="15" fill="#3563e9"/><text x="64" y="90" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="190" y="124" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">Quais campanhas valem agora?</text><text x="190" y="156" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">Só as não pausadas, dentro do</text><text x="190" y="178" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">período, do dia da semana</text><text x="190" y="200" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">e do horário (fuso da campanha)</text><line x1="344" y1="160" x2="366" y2="160" stroke="#3563e9" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="84" width="300" height="150" rx="14" fill="#ffffff" stroke="#3563e9" stroke-width="3"/><circle cx="394" cy="84" r="15" fill="#3563e9"/><text x="394" y="90" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="520" y="124" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">Quais alcançam esta TV?</text><text x="520" y="156" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">Todas as TVs, esta TV,</text><text x="520" y="178" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">o local dela ou</text><text x="520" y="200" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">um grupo de que ela faz parte</text><line x1="674" y1="160" x2="696" y2="160" stroke="#3563e9" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="84" width="300" height="150" rx="14" fill="#ffffff" stroke="#3563e9" stroke-width="3"/><circle cx="724" cy="84" r="15" fill="#3563e9"/><text x="724" y="90" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="850" y="124" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">Quem vence?</text><text x="850" y="156" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">A de maior prioridade.</text><text x="850" y="178" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">Empate: alvo mais específico</text><text x="850" y="200" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">(TV, grupo, local, todas); depois a mais nova</text><rect x="40" y="258" width="960" height="52" rx="12" fill="#eaf8f2" stroke="#19a66a" stroke-width="2"/><text x="520" y="280" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Sem nenhuma campanha valendo, a TV exibe a PLAYLIST DELA (a que você escolheu em Dispositivos).</text><text x="520" y="299" font-size="13" font-weight="400" fill="#6d7788" text-anchor="middle">A decisão é refeita a cada contato da TV com o servidor (30 s): a troca acontece sozinha, no horário certo.</text>
</svg>
