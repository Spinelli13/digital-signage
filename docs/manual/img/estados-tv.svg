<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#09090b" flood-opacity=".18"/></filter>
</defs>
<rect width="880" height="330" rx="18" fill="#f4f4f5"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0f0a16" text-anchor="start">O que significa o status de cada TV</text><circle cx="58" cy="90" r="9" fill="#19a66a"/><text x="82" y="96" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="start">Online</text><text x="262" y="96" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="start">Falou com o servidor nos últimos 2 minutos. Tudo certo.</text><circle cx="58" cy="136" r="9" fill="#6a6a73"/><text x="82" y="142" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="start">Offline</text><text x="262" y="142" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="start">Sem contato há mais de 2 minutos. Pode ser a internet da TV; ela continua exibindo o que já baixou.</text><circle cx="58" cy="182" r="9" fill="#e89a32"/><text x="82" y="188" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="start">Nunca conectou</text><text x="262" y="188" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="start">O dispositivo foi criado no painel mas o Player ainda não se conectou.</text><circle cx="58" cy="228" r="9" fill="#d6455d"/><text x="82" y="234" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="start">Desativado</text><text x="262" y="234" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="start">Você desativou a TV no painel. Ela para de exibir até ser reativada.</text><circle cx="58" cy="274" r="9" fill="#6d28d9"/><text x="82" y="280" font-size="16" font-weight="700" fill="#0f0a16" text-anchor="start">Aguardando ativação</text><text x="262" y="280" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="start">A TV mostrou o código, mas ninguém digitou no painel ainda.</text>
</svg>
