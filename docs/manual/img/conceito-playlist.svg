<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" width="1040" height="350" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#09090b" flood-opacity=".18"/></filter>
</defs>
<rect width="1040" height="350" rx="18" fill="#f4f4f5"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#0c1410" text-anchor="start">Como as peças se encaixam</text><rect x="40" y="90" width="260" height="184" rx="16" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/><text x="170" y="128" font-size="20" font-weight="800" fill="#0c1410" text-anchor="middle">Biblioteca</text><text x="170" y="156" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">Imagens (JPG, PNG, WEBP)</text><text x="170" y="172.9" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">e vídeos (MP4) enviados</text><text x="170" y="189.8" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">uma única vez</text><g transform="translate(70 216)"><rect width="52" height="34" rx="5" fill="#ff7a18"/><rect x="62" width="52" height="34" rx="5" fill="#d946ef"/><rect x="124" width="52" height="34" rx="5" fill="#8b5cf6"/></g><rect x="390" y="90" width="260" height="184" rx="16" fill="#ffffff" stroke="#e89a32" stroke-width="3"/><text x="520" y="128" font-size="20" font-weight="800" fill="#0c1410" text-anchor="middle">Playlist</text><text x="520" y="156" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">A ordem e a duração</text><text x="520" y="172.9" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">de cada mídia.</text><text x="520" y="189.8" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">Reaproveite em várias TVs</text><g transform="translate(424 216)"><rect width="52" height="34" rx="5" fill="#8b5cf6"/><rect x="62" width="52" height="34" rx="5" fill="#ff7a18"/><rect x="124" width="52" height="34" rx="5" fill="#d946ef"/></g><rect x="740" y="90" width="260" height="184" rx="16" fill="#ffffff" stroke="#d946ef" stroke-width="3"/><text x="870" y="128" font-size="20" font-weight="800" fill="#0c1410" text-anchor="middle">TV (dispositivo)</text><text x="870" y="156" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">Cada TV exibe uma</text><text x="870" y="172.9" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">playlist, em repetição,</text><text x="870" y="189.8" font-size="13" font-weight="400" fill="#6a6a73" text-anchor="middle">mesmo sem internet</text><g transform="translate(840 212) scale(0.5)"><rect width="120" height="76" rx="8" fill="#0c1410"/><rect x="8" y="8" width="104" height="60" rx="4" fill="#6d28d9" opacity=".9"/><rect x="48" y="80" width="24" height="8" fill="#0c1410"/><rect x="34" y="88" width="52" height="6" rx="3" fill="#0c1410"/></g><line x1="308" y1="182" x2="382" y2="182" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/><line x1="658" y1="182" x2="732" y2="182" stroke="#6d28d9" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="314" font-size="14" font-weight="400" fill="#6a6a73" text-anchor="start">Mudou a playlist no painel? Clique em "Publicar alterações": as TVs atualizam em até 1 minuto.</text>
</svg>
