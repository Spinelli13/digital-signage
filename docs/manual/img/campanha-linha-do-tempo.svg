<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" width="1040" height="360" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3563e9"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10204a" flood-opacity=".18"/></filter>
</defs>
<rect width="1040" height="360" rx="18" fill="#f5f7fb"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#172033" text-anchor="start">Exemplo: uma sexta-feira numa TV da Loja Shopping</text><text x="40" y="66" font-size="13" font-weight="400" fill="#6d7788" text-anchor="start">Entre parênteses, a prioridade de cada campanha.</text><text x="40" y="108" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Promoção de verão (50)</text><rect x="250" y="86" width="750" height="30" rx="6" fill="#e9edf5"/><rect x="250" y="86" width="750" height="30" rx="6" fill="#e89a32" opacity=".85"/><text x="40" y="160" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Cardápio do almoço (70)</text><rect x="250" y="138" width="750" height="30" rx="6" fill="#e9edf5"/><rect x="593.75" y="138" width="93.75" height="30" rx="6" fill="#19a66a" opacity=".85"/><text x="40" y="212" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Happy hour (80)</text><rect x="250" y="190" width="750" height="30" rx="6" fill="#e9edf5"/><rect x="812.5" y="190" width="156.25" height="30" rx="6" fill="#3563e9" opacity=".85"/><text x="40" y="278" font-size="15" font-weight="700" fill="#172033" text-anchor="start">O que a TV exibe</text><rect x="251" y="256" width="341.75" height="34" rx="6" fill="#e89a32"/><text x="421.875" y="278" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Promoção</text><rect x="594.75" y="256" width="91.75" height="34" rx="6" fill="#19a66a"/><text x="640.625" y="278" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Almoço</text><rect x="688.5" y="256" width="123" height="34" rx="6" fill="#e89a32"/><text x="750" y="278" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Promoção</text><rect x="813.5" y="256" width="154.25" height="34" rx="6" fill="#3563e9"/><text x="890.625" y="278" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Happy hour</text><rect x="969.75" y="256" width="29.25" height="34" rx="6" fill="#e89a32"/><line x1="250" y1="296" x2="250" y2="304" stroke="#6d7788"/><text x="250" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">00h</text><line x1="343.75" y1="296" x2="343.75" y2="304" stroke="#6d7788"/><text x="343.75" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">03h</text><line x1="437.5" y1="296" x2="437.5" y2="304" stroke="#6d7788"/><text x="437.5" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">06h</text><line x1="531.25" y1="296" x2="531.25" y2="304" stroke="#6d7788"/><text x="531.25" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">09h</text><line x1="625" y1="296" x2="625" y2="304" stroke="#6d7788"/><text x="625" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">12h</text><line x1="718.75" y1="296" x2="718.75" y2="304" stroke="#6d7788"/><text x="718.75" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">15h</text><line x1="812.5" y1="296" x2="812.5" y2="304" stroke="#6d7788"/><text x="812.5" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">18h</text><line x1="906.25" y1="296" x2="906.25" y2="304" stroke="#6d7788"/><text x="906.25" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">21h</text><line x1="1000" y1="296" x2="1000" y2="304" stroke="#6d7788"/><text x="1000" y="320" font-size="12" font-weight="400" fill="#6d7788" text-anchor="middle">24h</text><text x="40" y="346" font-size="12" font-weight="400" fill="#6d7788" text-anchor="start">Das 11h às 14h o almoço (prioridade 70) vence a promoção (50); das 18h às 23h o happy hour (80) vence tudo; no resto do dia vale a promoção.</text>
</svg>
