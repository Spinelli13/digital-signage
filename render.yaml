# Blueprint do Render: cria o backend de uma vez (New → Blueprint → escolher este repositório).
# Os valores marcados com `sync: false` são pedidos na tela de criação e NUNCA ficam no repositório.
# Passo a passo e como obter cada valor: docs/DEPLOY.md (Fase C).
services:
  - type: web
    name: signage-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      # Banco (Supabase, Session pooler). DB_URL = jdbc:postgresql://<host-do-pooler>:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "3"

      # Segurança
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # URL do painel (Cloudflare Pages), sem barra no final. Ex.: https://signage-painel.pages.dev
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Mídias (Supabase Storage via S3)
      - key: STORAGE_TYPE
        value: s3
      - key: S3_BUCKET
        value: media
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
